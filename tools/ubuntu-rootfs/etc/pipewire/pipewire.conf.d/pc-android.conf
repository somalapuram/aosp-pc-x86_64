# Ubuntu alongside Android: play Ubuntu's sound through Android
# (doc/10-ubuntu-alongside-android.md, step 3 M4).
#
# The sound card is Android's and stays Android's, so this container has no
# ALSA device at all. Instead:
#   - "Android speakers", a virtual sink, is the default output;
#   - protocol-simple serves that sink's mix as raw S16LE 48 kHz stereo on
#     127.0.0.1:4711, where Android's pc_ubuntu_audio reads it and plays it
#     through AAudio, mixed with Android's own sound.
# 127.0.0.1 only: Ubuntu shares Android's network namespace, so this is the
# machine's loopback, reachable from nothing outside it.

context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "pc-android"
            node.description        = "Android speakers"
            media.class             = Audio/Sink
            audio.position          = [ FL FR ]
            audio.rate              = 48000
            priority.session        = 2000
            priority.driver         = 2000
            monitor.channel-volumes = true
        }
    }
]

context.modules = [
    {   name = libpipewire-module-protocol-simple
        args = {
            capture        = true
            playback       = false
            audio.rate     = 48000
            audio.format   = S16LE
            audio.channels = 2
            audio.position = [ FL FR ]
            server.address = [ "tcp:127.0.0.1:4711" ]
            capture.props  = {
                target.object       = "pc-android"
                stream.capture.sink = true
            }
        }
    }
]
