# Ubuntu alongside Android: play Ubuntu's sound through Android
# (doc/10-ubuntu-alongside-android.md, step 3 M4).
#
# The sound card is Android's and stays Android's, so this container has no
# ALSA device at all. Instead:
#   - "Android speakers", a virtual sink, is the default output;
#   - protocol-simple serves that sink's mix as raw S16LE 48 kHz stereo on
#     127.0.0.1:4711, where Android's pc_ubuntu_audio reads it and plays it
#     through AAudio, mixed with Android's own sound;
#   - "Android microphone", a virtual source, is the default input, fed with
#     mono 48 kHz from Android's mic on 127.0.0.1:4712 (see below).
# 127.0.0.1 only: Ubuntu shares Android's network namespace, so this is the
# machine's loopback, reachable from nothing outside it.

context.objects = [
    {   factory = adapter
        args = {
            factory.name            = support.null-audio-sink
            node.name               = "pc-android"
            node.description        = "Android speakers"
            media.class             = Audio/Sink
            audio.position          = [ FL FR ]
            audio.rate              = 48000
            priority.session        = 2000
            priority.driver         = 2000
            monitor.channel-volumes = true
        }
    }
]

context.modules = [
    # The microphone, the other way round. Android records its mic only while
    # something here records from "Android microphone" (pc-mic-gate tells it),
    # and sends the samples to the protocol-simple playback server below.
    #
    # A loopback, not a virtual source: the session manager links playback
    # streams to SINKS, so the server's stream needs a sink to play into
    # (pc-android-mic-in), and the loopback turns that into a real
    # Audio/Source (pc-android-mic) that apps record from and that wins as the
    # default input. A bare Audio/Source/Virtual node was tried first: the
    # stream was never linked and every recording was silence, even with a
    # test tone fed straight into port 4712.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Android microphone"
            audio.position   = [ MONO ]
            capture.props = {
                node.name        = "pc-android-mic-in"
                node.description = "Android microphone (bridge input)"
                media.class      = Audio/Sink
                priority.session = 0
            }
            playback.props = {
                node.name        = "pc-android-mic"
                node.description = "Android microphone"
                media.class      = Audio/Source
                priority.session = 2000
            }
        }
    }
    {   name = libpipewire-module-protocol-simple
        args = {
            capture        = true
            playback       = false
            audio.rate     = 48000
            audio.format   = S16LE
            audio.channels = 2
            audio.position = [ FL FR ]
            server.address = [ "tcp:127.0.0.1:4711" ]
            capture.props  = {
                target.object       = "pc-android"
                stream.capture.sink = true
            }
        }
    }
    {   name = libpipewire-module-protocol-simple
        args = {
            capture        = false
            playback       = true
            audio.rate     = 48000
            audio.format   = S16LE
            audio.channels = 1
            audio.position = [ MONO ]
            server.address = [ "tcp:127.0.0.1:4712" ]
            playback.props = {
                target.object = "pc-android-mic-in"
            }
        }
    }
]
